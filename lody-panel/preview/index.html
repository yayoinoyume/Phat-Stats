<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lody Panel · preview</title>
<style>
  :root {
    --bg: #070806;
    --panel: #0E100F;
    --cream: #FFFCE1;
    --purple: #9D95FF;
    --green: #ABFF84;
    --orange: #FF8709;
    --gray: #96968A;
    --red: #FF5F57;
    --line: #1B1E1A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1100px 640px at 50% -10%, #12150f 0%, var(--bg) 62%);
    color: var(--cream);
    font-family: Inter, "SF Pro Text", "Segoe UI", "Noto Sans SC", "PingFang SC",
      "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 960px; display: flex; flex-direction: column; gap: 12px; }
  .hud { display: flex; align-items: center; gap: 10px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 9px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: .18em;
    border: 1px solid currentColor;
    transition: color .2s ease;
  }
  .badge i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .badge.live { color: var(--green); }
  .badge.demo { color: var(--purple); }
  .badge.lost { color: var(--red); }
  .hint { font-size: 10px; letter-spacing: .16em; color: #5F6358; text-transform: uppercase; }

  .stage-outer {
    width: 960px; height: 720px; overflow: hidden; border-radius: 4px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 0 1px #191c18;
  }
  .stage {
    --accent: var(--cream);
    position: relative; display: flex; overflow: hidden;
    width: 320px; height: 240px; background: var(--panel);
    transform: scale(3); transform-origin: top left;
  }

  /* ---------- left card: 240 x 240 ---------- */
  .card { position: relative; flex: none; width: 240px; height: 240px; }

  .topbar {
    position: absolute; left: 16px; right: 16px; top: 12px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; letter-spacing: .02em; color: #CFCCB4;
  }
  .elapsed { display: flex; align-items: center; white-space: nowrap; }
  .spark { display: block; margin-right: 6px; color: var(--accent); transition: color .2s ease; }
  .dots { display: flex; gap: 5px; align-items: center; }
  .dot {
    display: block; width: 5px; height: 5px; border-radius: 50%; background: #2A2D28;
    transition: background .25s ease, box-shadow .25s ease;
  }
  .dot.active { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--accent); }
  .stage[data-state="needs_you"] .dot.active { animation: dot-pulse 1.6s ease-in-out infinite; }
  @keyframes dot-pulse {
    0%, 100% { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--accent); }
    50% { box-shadow: 0 0 0 2px var(--panel), 0 0 0 6px var(--accent); }
  }

  .kicker {
    position: absolute; left: 16px; top: 120px;
    font-size: 9px; line-height: 10px; font-weight: 700;
    letter-spacing: .2em; white-space: nowrap;
    color: var(--accent); transition: color .2s ease;
  }
  .word {
    position: absolute; left: 16px; top: 62px;
    font-family: "Noto Sans CJK SC", "Noto Sans CJK JP", "Noto Sans SC",
      "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 56px; line-height: 56px; font-weight: 700;
    letter-spacing: .01em; white-space: nowrap;
    color: var(--accent); transition: color .2s ease;
  }

  .scanline {
    display: none; position: absolute; left: 16px; top: 136px;
    width: 208px; height: 2px; overflow: hidden; pointer-events: none;
  }
  .stage.working .scanline { display: block; }
  .scanline::after {
    content: ""; position: absolute; top: 0; left: -40%;
    width: 40%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scan 2.4s linear infinite;
  }
  @keyframes scan { to { left: 100%; } }

  .spinner {
    display: none; position: absolute; left: 174px; top: 74px;
    width: 44px; height: 44px; pointer-events: none;
  }
  .stage.working .spinner { display: block; animation: spin .64s steps(8) infinite; }
  .spinner i {
    position: absolute; left: 21px; top: 1px; width: 2px; height: 10px;
    border-radius: 1px; background: var(--accent);
    transform-origin: 1px 21px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .provider {
    position: absolute; left: 16px; right: 16px; top: 146px; height: 16px;
    display: flex; align-items: center; gap: 4px;
    font-size: 9px; line-height: 16px; white-space: nowrap;
    color: var(--gray);
  }
  .provider[hidden] { display: none !important; }
  .provider [hidden] { display: none !important; }
  .provider-icon { width: 16px; height: 16px; flex: none; display: block; object-fit: contain; }
  .provider-icon.invert { filter: brightness(0) invert(1); }
  .provider-model {
    min-width: 0; color: var(--gray);
    overflow: hidden; text-overflow: ellipsis;
    transform: translateY(1px);
  }

  .title {
    position: absolute; left: 16px; top: 166px; width: 208px;
    font-family: "Noto Sans CJK SC", "Noto Sans CJK JP", "Noto Sans SC",
      "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px; line-height: 22px; font-weight: 500; color: var(--cream);
    white-space: pre-line; overflow: hidden;
  }
  .bigclock {
    position: absolute; left: 16px; top: 166px;
    font-size: 34px; line-height: 1; font-weight: 700;
    letter-spacing: -.03em; color: var(--cream);
    font-variant-numeric: tabular-nums;
  }
  .meta {
    position: absolute; left: 16px; top: 214px; max-width: 208px;
    font-size: 11px; color: var(--gray); letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title[hidden], .bigclock[hidden] { display: none !important; }
  .meta b { font-weight: 500; color: #CFCCB4; }
  .meta .sep { margin: 0 5px; color: #4E5249; }

  /* ---------- right rail: 80 x 240 ---------- */
  .rail {
    position: relative; flex: none; width: 80px; height: 240px;
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 14px 10px 12px;
  }
  .mark { font-size: 11px; font-weight: 800; letter-spacing: .22em; color: var(--cream); }
  .clock {
    margin-top: 10px; font-size: 23px; font-weight: 700; line-height: 1;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .clock-colon, .big-colon { display: inline; }
  .stage[data-state="quiet"] .clock-colon,
  .stage[data-state="quiet"] .big-colon { animation: colon-blink 1.1s steps(1,end) infinite; }
  @keyframes colon-blink {
    0%, 45% { opacity: 1; }
    50%, 95% { opacity: .18; }
    100% { opacity: 1; }
  }
  .date { margin-top: 5px; font-size: 10px; color: var(--gray); letter-spacing: .06em; }
  .counts { margin-top: 18px; display: flex; flex-direction: column; gap: 7px; font-size: 10px; color: var(--gray); }
  .count { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .count b { flex: none; min-width: 24px; text-align: right; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .count:nth-child(1) b { color: var(--cream); }
  .count:nth-child(2) b { color: var(--purple); }
  .count:nth-child(3) b { color: var(--green); }
  .count.zero { opacity: .38; }
  .battery { margin-top: auto; display: flex; align-items: center; color: var(--gray); }
  .usb { font-size: 9px; letter-spacing: .14em; }

  .foot {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; letter-spacing: .04em; color: #6B6F63;
    font-variant-numeric: tabular-nums;
  }
  .foot .right { display: flex; gap: 14px; }

  .stage[data-state="link_lost"] .word,
  .stage[data-state="link_lost"] .kicker { animation: lost-breathe 2.2s ease-in-out infinite; }
  @keyframes lost-breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: .42; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage.working .spinner { animation: none; opacity: .35; }
    .scanline { display: none !important; }
    .stage[data-state="needs_you"] .dot.active,
    .stage[data-state="quiet"] .clock-colon,
    .stage[data-state="quiet"] .big-colon,
    .stage[data-state="link_lost"] .word,
    .stage[data-state="link_lost"] .kicker { animation: none; }
    .title, .provider { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <span class="badge live" id="badge"><i></i><span id="badgeText">LIVE</span></span>
      <span class="hint">Lody status &middot; 320&times;240 &middot; 3&times;</span>
    </div>

    <div class="stage-outer">
      <div class="stage" id="stage" data-state="quiet">
        <div class="card">
          <div class="topbar">
            <span class="elapsed">
              <svg class="spark" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
                <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                  <path d="M6 1v10M1.7 3.5l8.6 5M1.7 8.5l8.6-5"/>
                </g>
              </svg>
              <span id="elapsed">nothing running</span>
            </span>
            <span class="dots" id="dots"></span>
          </div>

          <div class="kicker" id="kicker">ALL QUIET</div>
          <div class="word" id="word">空闲</div>
          <div class="spinner" id="spinner" aria-hidden="true"></div>
          <div class="scanline" aria-hidden="true"></div>

          <div class="provider" id="provider" hidden>
            <img class="provider-icon" id="providerIcon" src="icons/lody.svg" alt="lody">
            <span class="provider-model" id="providerModel"></span>
          </div>

          <div class="title" id="title">waiting for state</div>
          <div class="bigclock" id="bigclock" hidden><span id="bigHour">--</span><span class="big-colon">:</span><span id="bigMin">--</span></div>
          <div class="meta" id="meta">
            <b id="metaProject">&mdash;</b><span class="sep">&middot;</span><span id="metaMachine">remote</span>
          </div>
        </div>

        <div class="rail">
          <div class="mark">LODY</div>
          <div class="clock" id="clock"><span id="clockHour">--</span><span class="clock-colon">:</span><span id="clockMin">--</span></div>
          <div class="date" id="date">--</div>
          <div class="counts">
            <div class="count"><b id="cWork">0</b><span>work</span></div>
            <div class="count"><b id="cNeeds">0</b><span>yours</span></div>
            <div class="count"><b id="cDone">0</b><span>today</span></div>
          </div>
          <div class="battery" aria-hidden="true">
            <span class="usb">USB</span>
          </div>
        </div>
      </div>
    </div>

    <div class="foot">
      <span id="footHost">&mdash;</span>
      <span class="right"><span id="footState">&mdash;</span><span id="footSeq">seq &mdash;</span></span>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var COLORS = {
    working: '#FFFCE1',
    needs_you: '#9D95FF',
    done: '#ABFF84',
    quiet: '#FFFCE1',
    error: '#FF8709',
    link_lost: '#FF5F57'
  };
  var KICKERS = {
    working: 'ON IT',
    needs_you: 'YOUR TURN',
    done: 'ALL SET',
    quiet: 'ALL QUIET',
    error: 'CHECK',
    link_lost: 'LINK LOST'
  };
  var BIG_WORDS = {
    working: '在跑',
    needs_you: '等你',
    done: '完成',
    quiet: '空闲',
    error: '出错',
    link_lost: '断线'
  };
  var KNOWN = { working: 1, needs_you: 1, done: 1, quiet: 1, error: 1, link_lost: 1 };
  var ICON_KEYS = {
    pi: 1, claudecode: 1, codex: 1, geminicli: 1, qwen: 1, kimi: 1,
    glm: 1, deepseek: 1, openai: 1, mistral: 1, grok: 1, lody: 1
  };
  var DARK_ICONS = { lody: 1, geminicli: 1, glm: 1 };
  var TITLE_PROTECTED = [
    '数据库', '通知', '接口', '服务', '监控', '开发', '固件', '状态',
    '屏幕', '项目', '修复', '实现', '检查', '设备', '电量', '签到', '面板',
    '部署', '配置', '测试'
  ];
  var TITLE_BREAK_PUNCT = '、，。：；/ ,.;:';
  var titleMeasure = document.createElement('canvas').getContext('2d');
  var titleWidthCache = {};
  var titleLayoutCache = {};
  var MAX_AGE = 604800;
  var LOST_AFTER_MS = 20000;

  var stage = document.getElementById('stage');
  var badge = document.getElementById('badge');
  var badgeText = document.getElementById('badgeText');
  var elapsedEl = document.getElementById('elapsed');
  var kickerEl = document.getElementById('kicker');
  var wordEl = document.getElementById('word');
  var dots = document.getElementById('dots');
  var spinner = document.getElementById('spinner');
  var titleEl = document.getElementById('title');
  var bigclock = document.getElementById('bigclock');
  var metaProject = document.getElementById('metaProject');
  var metaMachine = document.getElementById('metaMachine');
  var providerEl = document.getElementById('provider');
  var providerIcon = document.getElementById('providerIcon');
  var providerModelEl = document.getElementById('providerModel');
  var clockHour = document.getElementById('clockHour');
  var clockMin = document.getElementById('clockMin');
  var bigHour = document.getElementById('bigHour');
  var bigMin = document.getElementById('bigMin');
  var dateEl = document.getElementById('date');
  var cWork = document.getElementById('cWork');
  var cNeeds = document.getElementById('cNeeds');
  var cDone = document.getElementById('cDone');
  var footHost = document.getElementById('footHost');
  var footState = document.getElementById('footState');
  var footSeq = document.getElementById('footSeq');

  var frameAt = 0;
  var lastFrame = null;
  var lastState = '';
  var lastFeatured = null;
  var lastFeaturedKey = '';
  var fadeTimers = new WeakMap();
  var rotateIndex = 0;
  var rotateAt = 0;
  var demoMode = false;
  var linkLost = false;

  function num(value) {
    var n = Number(value);
    return isFinite(n) && n > 0 ? Math.trunc(n) : 0;
  }
  function str(value) {
    return typeof value === 'string' ? value.trim() : '';
  }
  function isObject(value) {
    return value !== null && typeof value === 'object';
  }
  function two(n) {
    return (n < 10 ? '0' : '') + n;
  }
  function timeText(date) {
    return two(date.getHours()) + ':' + two(date.getMinutes());
  }
  function setClock(date) {
    var hour = two(date.getHours());
    var minute = two(date.getMinutes());
    clockHour.textContent = hour;
    clockMin.textContent = minute;
    bigHour.textContent = hour;
    bigMin.textContent = minute;
  }
  function dateText(date) {
    return two(date.getMonth() + 1) + '-' + two(date.getDate());
  }
  function shortSpan(seconds) {
    var s = Math.max(0, seconds);
    if (s < 60) return Math.max(1, Math.round(s)) + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm';
    if (s < 86400) return Math.floor(s / 3600) + 'h';
    return Math.floor(s / 86400) + 'd';
  }
  function normalizeState(state, counts, sessions) {
    var name = str(state);
    if (KNOWN[name]) return name;
    if (name === 'running') return 'working';
    if (num(counts.needs)) return 'needs_you';
    if (num(counts.working)) return 'working';
    if (num(counts.done)) return 'done';
    if (sessions.length) return normalizeState(sessions[0].state, counts, []);
    return 'quiet';
  }

  function pickSession(state, sessions) {
    // Rotation stays inside the six rendered dots, so the title always has a
    // visible active dot. The bridge already orders needs_you first.
    var visible = sessions.slice(0, 6);
    if (!visible.length) return null;
    if (state === 'needs_you') {
      rotateIndex = 0;
      for (var i = 0; i < visible.length; i++) {
        if (visible[i].state === 'needs_you') return visible[i];
      }
      return visible[0];
    }
    if (state !== lastState) {
      rotateIndex = 0;
      rotateAt = Date.now() + 14000;
    } else if (Date.now() >= rotateAt) {
      rotateIndex = (rotateIndex + 1) % visible.length;
      rotateAt = Date.now() + 14000;
    }
    return visible[Math.min(rotateIndex, visible.length - 1)];
  }

  function elapsedText(state, session) {
    var seconds = 0;
    if (session) {
      seconds = num(session.age);
      if (frameAt) seconds += Math.max(0, (Date.now() - frameAt) / 1000);
      seconds = Math.min(seconds, MAX_AGE);
    }
    var span = shortSpan(seconds);
    if (state === 'working') return span + ' so far';
    if (state === 'needs_you') return span + ' waiting';
    if (state === 'done') return span + ' ago';
    if (state === 'quiet') return 'nothing running';
    if (state === 'error') return 'no data';
    return 'no link';
  }

  function setDot(color, active) {
    var el = document.createElement('i');
    el.className = 'dot' + (active ? ' active' : '');
    if (color) el.style.background = color;
    dots.appendChild(el);
  }
  function renderDots(sessions, featured) {
    dots.textContent = '';
    if (!sessions.length) {
      setDot(null); setDot(null); setDot(null);
      return;
    }
    sessions.slice(0, 6).forEach(function (session) {
      setDot(COLORS[session.state] || COLORS.quiet, session === featured);
    });
  }

  function renderCounts(counts) {
    var values = [
      [cWork, num(counts.working)],
      [cNeeds, num(counts.needs)],
      [cDone, num(counts.done)]
    ];
    values.forEach(function (pair) {
      pair[0].textContent = String(pair[1]);
      pair[0].parentNode.classList.toggle('zero', pair[1] === 0);
    });
  }

  function setMeta(project, machine) {
    metaProject.textContent = project || '\u2014';
    metaMachine.textContent = machine || '\u2014';
  }

  function isSpaceChar(ch) {
    var c = ch.charCodeAt(0);
    return c === 32 || c === 9 || c === 10 || c === 13;
  }

  function isWordChar(ch) {
    var c = ch.charCodeAt(0);
    return (c >= 48 && c <= 57) || (c >= 65 && c <= 90) ||
      (c >= 97 && c <= 122) || '._-+/:#'.indexOf(ch) >= 0;
  }

  function isAsciiUnit(unit) {
    if (!unit || unit === ' ') return false;
    for (var i = 0; i < unit.length; i++) {
      if (unit.charCodeAt(i) > 0x7f) return false;
    }
    return true;
  }

  function normalizeTitle(text) {
    text = String(text);
    var out = '', pendingSpace = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (isSpaceChar(ch)) {
        if (out) pendingSpace = true;
      } else {
        if (pendingSpace) { out += ' '; pendingSpace = false; }
        out += ch;
      }
    }
    return out || 'untitled';
  }

  function titleTokens(text) {
    var tokens = [], i = 0;
    while (i < text.length) {
      var protectedWord = null;
      for (var p = 0; p < TITLE_PROTECTED.length; p++) {
        var word = TITLE_PROTECTED[p];
        if (text.indexOf(word, i) === i) { protectedWord = word; break; }
      }
      if (protectedWord) {
        tokens.push(protectedWord);
        i += protectedWord.length;
        continue;
      }
      var ch = text.charAt(i);
      if (isSpaceChar(ch)) {
        tokens.push(' ');
        i += 1;
        while (i < text.length && isSpaceChar(text.charAt(i))) i += 1;
        continue;
      }
      if (isWordChar(ch)) {
        var j = i + 1;
        while (j < text.length && isWordChar(text.charAt(j))) j += 1;
        tokens.push(text.slice(i, j));
        i = j;
        continue;
      }
      tokens.push(ch);
      i += 1;
    }
    return tokens;
  }

  function measureTitleTokens(tokens, size) {
    titleMeasure.font = '500 ' + size +
      'px "Noto Sans CJK SC", "Noto Sans CJK JP", "Noto Sans SC", sans-serif';
    var widths = {};
    for (var i = 0; i < tokens.length; i++) {
      var token = tokens[i];
      if (token === ' ') continue;
      var key = size + '|' + token;
      if (!(key in titleWidthCache)) {
        titleWidthCache[key] = titleMeasure.measureText(token).width;
      }
      widths[token] = titleWidthCache[key];
    }
    widths[' '] = titleMeasure.measureText(' ').width;
    return widths;
  }

  function titleUnits(text, size) {
    var tokens = titleTokens(text);
    var widths = measureTitleTokens(tokens, size);
    var units = [];
    for (var i = 0; i < tokens.length; i++) {
      var token = tokens[i];
      if (token !== ' ' && widths[token] > 208) {
        for (var j = 0; j < token.length; j++) units.push(token.charAt(j));
      } else {
        units.push(token);
      }
    }
    widths = measureTitleTokens(units, size);
    return { units: units, widths: widths };
  }

  function titleBreakPriority(units, index) {
    if (index < 0 || index >= units.length) return 0;
    var unit = units[index];
    if (unit === ' ' || TITLE_BREAK_PUNCT.indexOf(unit.charAt(unit.length - 1)) >= 0) {
      return 3;
    }
    if (index + 1 >= units.length) return 0;
    var next = units[index + 1];
    if (next !== ' ' && isAsciiUnit(unit) !== isAsciiUnit(next)) return 2;
    if (TITLE_PROTECTED.indexOf(unit) >= 0) return 1;
    return 0;
  }

  function takeTitleLine(units, start, budget, widths) {
    var i = start;
    while (i < units.length && units[i] === ' ') i += 1;
    var lineStart = i, used = 0, bestEnd = -1, bestPriority = -1, bestWidth = 0;
    while (i < units.length) {
      var width = widths[units[i]];
      if (used + width > budget) break;
      used += width;
      i += 1;
      var priority = titleBreakPriority(units, i - 1);
      if (priority > bestPriority || (priority === bestPriority && i > bestEnd)) {
        bestEnd = i;
        bestPriority = priority;
        bestWidth = used;
      }
    }
    if (i >= units.length && i > lineStart) {
      bestEnd = i;
      bestWidth = used;
      bestPriority = Math.max(bestPriority, 1);
    }
    if (bestEnd < 0) return { text: '', next: lineStart, width: 0, priority: 0 };
    return {
      text: units.slice(lineStart, bestEnd).join('').replace(/ +$/, ''),
      next: bestEnd,
      width: bestWidth,
      priority: bestPriority
    };
  }

  function layoutTitleAtSize(text, size) {
    var data = titleUnits(text, size);
    var units = data.units, widths = data.widths;
    var ellipsis = '…';
    if (!(ellipsis in widths)) {
      widths[ellipsis] = measureTitleTokens([ellipsis], size)[ellipsis];
    }
    var line1 = takeTitleLine(units, 0, 208, widths);
    if (!line1.text) line1.text = 'untitled';
    if (line1.next >= units.length) return [line1.text];
    var line2 = takeTitleLine(units, line1.next, 208, widths);
    if (line2.next >= units.length) {
      return line2.text ? [line1.text, line2.text] : [line1.text];
    }
    var reduced = takeTitleLine(units, line1.next, 208 - widths[ellipsis], widths);
    return [line1.text, (reduced.text ? reduced.text : '') + ellipsis];
  }

  function layoutTitle(text, size) {
    var normalized = normalizeTitle(text);
    var key = size + '|' + normalized;
    if (!(key in titleLayoutCache)) {
      titleLayoutCache[key] = layoutTitleAtSize(normalized, size);
    }
    return titleLayoutCache[key];
  }

  function renderTitle(featured) {
    var size = num(featured.titleSize) || 16;
    if (size !== 14 && size !== 15 && size !== 16) size = 16;
    var lines = layoutTitle(str(featured.title) || 'untitled', size);
    titleEl.style.fontSize = size + 'px';
    titleEl.textContent = lines.join(String.fromCharCode(10));
  }

  function setPlainTitle(text) {
    titleEl.style.fontSize = '16px';
    titleEl.textContent = text;
  }

  function renderProvider(featured) {
    if (!featured) {
      providerEl.hidden = true;
      return;
    }
    var key = str(featured.provider).toLowerCase().replace(/[^a-z0-9]/g, '') || 'lody';
    if (!ICON_KEYS[key]) key = 'lody';
    var model = str(featured.model);
    providerEl.hidden = false;
    providerIcon.src = 'icons/' + key + '.svg';
    providerIcon.alt = key;
    providerIcon.classList.toggle('invert', !!DARK_ICONS[key]);
    providerModelEl.textContent = model;
    providerModelEl.hidden = !model;
  }

  function restartFade(el) {
    var old = fadeTimers.get(el);
    if (old) clearTimeout(old);
    el.style.transition = 'none';
    el.style.opacity = '0';
    void el.offsetWidth;
    el.style.transition = 'opacity .28s ease';
    el.style.opacity = '1';
    var timer = setTimeout(function () {
      el.style.transition = 'none';
      el.style.opacity = '';
      fadeTimers.delete(el);
    }, 320);
    fadeTimers.set(el, timer);
  }

  providerIcon.addEventListener('error', function () {
    if (providerIcon.getAttribute('src') !== 'icons/lody.svg') {
      providerIcon.src = 'icons/lody.svg';
    }
  });

  function renderFrame(frame, options) {
    options = options || {};
    frame = isObject(frame) ? frame : {};
    var sessions = Array.isArray(frame.sessions)
      ? frame.sessions.filter(isObject)
      : [];
    var counts = isObject(frame.counts) ? frame.counts : {};
    var state = normalizeState(frame.state, counts, sessions);
    var kicker = KICKERS[state] || KICKERS.quiet;
    var word = BIG_WORDS[state] || BIG_WORDS.quiet;

    stage.classList.toggle('working', state === 'working');
    stage.dataset.state = state;
    stage.style.setProperty('--accent', COLORS[state] || COLORS.quiet);
    badge.classList.toggle('lost', !!options.lost);

    kickerEl.textContent = kicker;
    wordEl.textContent = word;

    var featured = state === 'quiet' ? null : pickSession(state, sessions);
    lastFeatured = featured;
    renderProvider(featured);

    if (featured) {
      titleEl.hidden = false;
      bigclock.hidden = true;
      renderTitle(featured);
      setMeta(str(featured.project) || 'lody', str(featured.machine) || 'remote');
    } else if (state === 'quiet') {
      titleEl.hidden = true;
      setPlainTitle('');
      bigclock.hidden = false;
      setClock(new Date());
      setMeta('no sessions', 'lody');
    } else if (state === 'error') {
      titleEl.hidden = false;
      bigclock.hidden = true;
      setPlainTitle(str(frame.message) || 'lody cli not reachable');
      setMeta('lody', 'error');
    } else if (state === 'link_lost') {
      titleEl.hidden = false;
      bigclock.hidden = true;
      setPlainTitle('Check computer');
      setMeta('lody', 'offline');
    } else {
      titleEl.hidden = false;
      bigclock.hidden = true;
      setPlainTitle('waiting for the bridge');
      setMeta('no state.json', 'retrying');
    }

    var featuredKey = state;
    if (featured) {
      featuredKey = [
        featured.id, featured.title, featured.provider,
        featured.model, featured.titleSize
      ].join('|');
    }
    if (featuredKey !== lastFeaturedKey) {
      lastFeaturedKey = featuredKey;
      restartFade(titleEl);
      restartFade(providerEl);
    }

    elapsedEl.textContent = elapsedText(state, featured);
    renderDots(sessions, featured);
    renderCounts(state === 'link_lost' ? {} : counts);

    lastFrame = frame;
    lastState = state;
    linkLost = state === 'link_lost';
  }

  function tickClock() {
    var now = new Date();
    setClock(now);
    dateEl.textContent = dateText(now);
    if (lastFrame && !demoMode) {
      var sessions = Array.isArray(lastFrame.sessions)
        ? lastFrame.sessions.filter(isObject)
        : [];
      var counts = isObject(lastFrame.counts) ? lastFrame.counts : {};
      var state = normalizeState(lastFrame.state, counts, sessions);
      elapsedEl.textContent = elapsedText(state, lastFeatured);
    }
  }

  function buildSpinner() {
    for (var i = 0; i < 8; i++) {
      var spoke = document.createElement('i');
      spoke.style.transform = 'rotate(' + (i * 45) + 'deg)';
      spoke.style.opacity = String(1 - i * 0.11);
      spinner.appendChild(spoke);
    }
  }

  /* ------------------------------ live ------------------------------ */
  var lastGoodAt = 0;
  function startLive() {
    lastGoodAt = Date.now();
    badgeText.textContent = 'LIVE';
    badge.className = 'badge live';
    footState.textContent = 'live';
    function load() {
      // Relative so the same file works from / and /index.html under --serve.
      fetch('state.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('http ' + response.status);
          return response.json();
        })
        .then(function (frame) {
          lastGoodAt = Date.now();
          frameAt = lastGoodAt;
          renderFrame(frame, {});
          badgeText.textContent = 'LIVE';
          badge.className = 'badge live';
          footHost.textContent = str(frame.host) || location.host;
          footState.textContent = 'live';
          footSeq.textContent = 'seq ' + num(frame.seq);
        })
        .catch(function () {
          // One failed poll is normal; only drop the link after 20 s without
          // a successful frame. Keep the last good frame visible until then.
          if (!linkLost && Date.now() - lastGoodAt >= LOST_AFTER_MS) {
            frameAt = 0;
            lastFeatured = null;
            renderFrame({ state: 'link_lost' }, { lost: true });
            badgeText.textContent = 'LINK LOST';
            badge.className = 'badge lost';
            footState.textContent = 'link lost';
            if (!footHost.textContent || footHost.textContent === '\u2014') {
              footHost.textContent = location.host || 'preview';
            }
          } else if (!linkLost) {
            footState.textContent = 'retrying';
          }
        });
    }
    load();
    setInterval(load, 1000);
  }

  /* ------------------------------ demo ------------------------------ */
  var DEMO_PROVIDERS = {
    'demo-1': { provider: 'pi', model: 'DeepSeek' },
    'demo-2': { provider: 'claudecode', model: 'Claude' },
    'demo-3': { provider: 'codex', model: 'Gemini' },
    'demo-4': { provider: 'qwen', model: 'Qwen' },
    'demo-5': { provider: 'openai', model: 'GPT' },
    'demo-6': { provider: 'kimi', model: '' },
    'demo-7': { provider: 'geminicli', model: '' },
    'demo-8': { provider: 'mistral', model: '' },
    'demo-9': { provider: 'lody', model: '' }
  };
  var DEMO_FRAMES = [
    {
      state: 'working',
      counts: { working: 2, needs: 0, done: 1 },
      sessions: [
        { id: 'demo-1', state: 'working', title: '重构支付接口', project: 'example-app', machine: 'local', age: 95 },
        { id: 'demo-2', state: 'working', title: '迁移测试环境数据库', project: 'example-app', machine: 'local', age: 240 },
        { id: 'demo-3', state: 'done', title: '发布 2.4 更新说明', project: 'backup-service', machine: 'remote', age: 1800 }
      ]
    },
    {
      state: 'needs_you',
      counts: { working: 1, needs: 2, done: 1 },
      sessions: [
        { id: 'demo-4', state: 'needs_you', title: '检查设备电量状态', project: 'backup-service', machine: 'remote', age: 312 },
        { id: 'demo-5', state: 'needs_you', title: '确认隧道恢复演练结果', project: 'ops-hub', machine: 'local', age: 540 },
        { id: 'demo-1', state: 'working', title: '重构支付接口', project: 'example-app', machine: 'local', age: 95 },
        { id: 'demo-6', state: 'done', title: '评审服务密钥补丁', project: 'agent-service', machine: 'remote', age: 7200 }
      ]
    },
    {
      state: 'done',
      counts: { working: 0, needs: 0, done: 3 },
      sessions: [
        { id: 'demo-7', state: 'done', title: '面板多账号接入与扫码登录', project: 'example-app', machine: 'local', age: 2400 },
        { id: 'demo-8', state: 'done', title: '同步主分支并解决发布冲突', project: 'blog-app', machine: 'local', age: 5400 },
        { id: 'demo-9', state: 'done', title: '晨间早报', project: 'chat', machine: 'remote', age: 9000 }
      ]
    },
    {
      state: 'quiet',
      counts: { working: 0, needs: 0, done: 0 },
      sessions: []
    }
  ];

  function startDemo() {
    demoMode = true;
    badgeText.textContent = 'DEMO';
    badge.className = 'badge demo';
    footHost.textContent = 'demo host';
    footState.textContent = 'demo';
    var index = 0;
    function step() {
      var base = DEMO_FRAMES[index % DEMO_FRAMES.length];
      index += 1;
      var now = new Date();
      var frame = {
        v: 1,
        seq: index,
        ts: Math.floor(now.getTime() / 1000),
        time: timeText(now),
        date: dateText(now),
        host: 'demo-host',
        state: base.state,
        counts: base.counts,
        sessions: base.sessions.map(function (session) {
          var extra = DEMO_PROVIDERS[session.id] ||
            { provider: 'lody', model: '' };
          var copy = {};
          var key;
          for (key in session) copy[key] = session[key];
          for (key in extra) copy[key] = extra[key];
          return copy;
        })
      };
      frameAt = Date.now();
      renderFrame(frame, {});
      footSeq.textContent = 'seq ' + index;
    }
    step();
    setInterval(step, 4000);
  }

  buildSpinner();
  tickClock();
  setInterval(tickClock, 1000);

  var demo = false;
  try {
    demo = new URLSearchParams(location.search).get('demo') === '1';
  } catch (error) {
    demo = false;
  }
  // file:// cannot fetch state.json; show the demo instead of a permanent loss.
  if (location.protocol === 'file:') demo = true;
  if (demo) {
    startDemo();
  } else {
    startLive();
  }
}());
</script>
